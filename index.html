<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>collarbone</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="landing">
      <h1>collarbone</h1>

      <nav class="socials" aria-label="Social links">
        <a
          class="social-link"
          href="https://soundcloud.com/collarbonebeats"
          data-label="SoundCloud"
          aria-label="SoundCloud"
        >
          <i class="fa-brands fa-soundcloud" aria-hidden="true"></i>
        </a>

        <a
          class="social-link"
          href="https://www.youtube.com/@collarbonebeats"
          data-label="YouTube"
          aria-label="YouTube"
        >
          <i class="fa-brands fa-youtube" aria-hidden="true"></i>
        </a>

        <a
          class="social-link"
          href="https://x.com/collarbonebeats"
          data-label="X"
          aria-label="X (Twitter)"
        >
          <i class="fa-brands fa-x-twitter" aria-hidden="true"></i>
        </a>

        <a
          class="social-link"
          href="https://www.instagram.com/collarbonebeats/"
          data-label="Instagram"
          aria-label="Instagram"
        >
          <i class="fa-brands fa-instagram" aria-hidden="true"></i>
        </a>
      </nav>
    </main>

    <script src="script.js"></script>
  </body>
</html>
