<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>collarbone</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Inter:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="dithering"></div>
    <main class="landing">
      <h1>collarbone</h1>

      <a class="release-bar" href="drowning">
        <img src="img/drowning-in-moonlight/cover.png" alt="" />
        <div class="release-bar__text">
          <span class="release-bar__label"><svg width="10" height="10" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>Latest Release</span>
          <span class="release-bar__title">drowning in moonlight</span>
        </div>
        <svg class="release-bar__chevron" width="14" height="14" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </a>

      <nav class="socials" aria-label="Social links">
        <a
          class="social-link"
          href="https://www.instagram.com/collarbonebeats/"
          aria-label="Instagram"
        >
          <i class="fa-brands fa-instagram" aria-hidden="true"></i>
        </a>

        <a
          class="social-link"
          href="https://x.com/collarbonebeats"
          aria-label="X (Twitter)"
        >
          <i class="fa-brands fa-x-twitter" aria-hidden="true"></i>
        </a>
      </nav>
    </main>

    <script src="script.js"></script>
    <script src="dithering.bundle.js"></script>
  </body>
</html>
